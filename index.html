<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>精准网页时钟</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eff1f4;
        --bg-2: #e7ebf1;
        --surface: rgba(255, 255, 255, 0.78);
        --surface-strong: #ffffff;
        --border: rgba(60, 60, 67, 0.18);
        --text: #0f1115;
        --muted: #5c5c67;
        --accent: #0a84ff;
        --accent-2: #34c759;
        --shadow: rgba(15, 23, 42, 0.12);
        --ring: rgba(10, 132, 255, 0.18);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 500px at 15% 20%, rgba(10, 132, 255, 0.18), transparent 60%),
          radial-gradient(700px 380px at 85% 15%, rgba(52, 199, 89, 0.16), transparent 55%),
          linear-gradient(160deg, var(--bg), var(--bg-2));
        color: var(--text);
        font-family: "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        padding: 32px 16px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(120deg, rgba(255, 255, 255, 0.35), transparent 50%),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.18) 0,
            rgba(255, 255, 255, 0.18) 1px,
            transparent 1px,
            transparent 3px
          );
        opacity: 0.35;
        pointer-events: none;
      }

      .window {
        width: min(940px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow:
          0 30px 60px var(--shadow),
          0 12px 22px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(22px);
        animation: floatIn 0.7s ease both;
        padding: clamp(22px, 6vw, 44px);
      }

      .header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
        animation: fadeUp 0.7s ease both;
      }

      .title {
        font-size: clamp(20px, 2.8vw, 28px);
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--text);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(10, 132, 255, 0.25);
        color: var(--accent);
        background: rgba(10, 132, 255, 0.12);
      }

      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(10, 132, 255, 0.4);
      }

      .time-display {
        font-family: "SF Mono", "Menlo", monospace;
        font-size: clamp(34px, 9vw, 88px);
        font-weight: 600;
        letter-spacing: 0.06em;
        text-align: center;
        padding: clamp(16px, 4vw, 26px) clamp(12px, 3vw, 20px);
        border-radius: 20px;
        background: var(--surface-strong);
        border: 1px solid var(--border);
        box-shadow:
          0 18px 34px rgba(15, 23, 42, 0.12),
          inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        animation: fadeUp 0.8s ease both 0.1s;
      }

      .time-grid {
        display: grid;
        grid-template-columns: 2.2ch 1.2ch 2.2ch 1.2ch 2.2ch 1.6ch 3ch;
        align-items: baseline;
        justify-content: center;
        row-gap: 12px;
      }

      .time-grid span {
        display: inline-block;
      }

      .ms {
        font-size: 0.55em;
        color: var(--accent);
        letter-spacing: 0.12em;
        padding-left: 0.2em;
      }

      .unit {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 600;
      }

      .unit {
        opacity: 0.9;
      }

      .sub {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
        animation: fadeUp 0.8s ease both 0.2s;
      }

      .hint {
        max-width: 520px;
        line-height: 1.5;
      }

      .control {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle {
        appearance: none;
        width: 46px;
        height: 26px;
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.2);
        position: relative;
        outline: none;
        cursor: pointer;
        transition: background 0.2s ease;
        box-shadow: inset 0 0 0 1px rgba(60, 60, 67, 0.25);
      }

      .toggle::after {
        content: "";
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: transform 0.2s ease;
        box-shadow: 0 6px 14px rgba(15, 23, 42, 0.25);
      }

      .toggle:checked {
        background: rgba(10, 132, 255, 0.7);
        box-shadow: inset 0 0 0 1px rgba(10, 132, 255, 0.5);
      }

      .toggle:checked::after {
        transform: translateX(20px);
      }

      .label {
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      @media (max-width: 600px) {
        .sub {
          flex-direction: column;
          align-items: flex-start;
        }

        .time-display {
          letter-spacing: 0.03em;
        }

        .unit {
          font-size: 11px;
          letter-spacing: 0.04em;
        }
      }

      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="window">
      <div class="header">
        <div class="title">精准时间</div>
        <div class="badge">同步本地系统时间</div>
      </div>

      <div class="time-display" aria-live="polite" aria-label="当前时间">
        <div class="time-grid" aria-hidden="true">
          <span id="hh">00</span>
          <span>:</span>
          <span id="mm">00</span>
          <span>:</span>
          <span id="ss">00</span>
          <span class="ms">.</span>
          <span class="ms" id="ms">000</span>

          <span class="unit">小时</span>
          <span></span>
          <span class="unit">分钟</span>
          <span></span>
          <span class="unit">秒</span>
          <span></span>
          <span class="unit">毫秒</span>
        </div>
      </div>

      <div class="sub">
        <div class="hint">建议提前打开页面，保持窗口在前台，避免系统进入省电或休眠状态影响刷新频率。</div>
        <div class="control">
          <input class="toggle" id="formatToggle" type="checkbox" />
          <label class="label" for="formatToggle">24小时制</label>
        </div>
      </div>
    </main>

    <script>
      const hh = document.getElementById("hh");
      const mm = document.getElementById("mm");
      const ss = document.getElementById("ss");
      const ms = document.getElementById("ms");
      const formatToggle = document.getElementById("formatToggle");

      const pad = (value, length = 2) => String(value).padStart(length, "0");

      let use24 = true;
      formatToggle.checked = true;

      formatToggle.addEventListener("change", () => {
        use24 = formatToggle.checked;
      });

      const update = () => {
        const now = new Date();
        let hours = now.getHours();
        if (!use24) {
          hours = hours % 12 || 12;
        }

        hh.textContent = pad(hours);
        mm.textContent = pad(now.getMinutes());
        ss.textContent = pad(now.getSeconds());
        ms.textContent = pad(now.getMilliseconds(), 3);

        requestAnimationFrame(update);
      };

      requestAnimationFrame(update);
    </script>
  </body>
</html>
